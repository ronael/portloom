name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Portloom version, OS, architecture and terminal. English or French is welcome.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and observed behavior
      description: Use disposable test processes; remove private information from screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
