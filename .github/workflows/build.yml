name: Verify and package Portloom
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: darwin-x64
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and scanner prerequisites
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
          command -v node
          command -v python3
          if [ "${RUNNER_OS}" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y lsof; fi
      - run: npm run verify
      - run: sh scripts/dev/build.sh ${{ matrix.target }}
      - run: python3 scripts/dev/terminal_smoke.py
      - run: python3 scripts/dev/language_smoke.py
      - run: node scripts/release/pack.mjs --platforms=${{ matrix.platform }}
      - run: node scripts/release/smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: dist/native/
          if-no-files-found: error
  package:
    timeout-minutes: 10
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true
      - run: node scripts/release/pack.mjs --platforms=darwin-arm64,darwin-x64,linux-arm64,linux-x64
      - run: node scripts/release/smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portloom-npm
          path: dist/npm/
          if-no-files-found: error
